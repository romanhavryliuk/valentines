<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Valentine's Proposal</title>
</head>

<body>
  <div class="container">
    <div class="Mainprompt">
      <img class="img" src="img/cute.gif"></img>
      <div class="text">
        <h1 class="title" id="name">Привіт, красуне!</h1>
        <p class="subtitle" id="question">Чи віриш ти в маленькі дива в день закоханих?</p>
      </div>
      <div class="buttons">
        <button class="button no" id="no-button" onclick="showMessage('No')">Ні</button>
        <button class="button yes" onclick="showMessage('Yes')" id="yesButton">Так</button>
      </div>
    </div>
  </div>
  <script>

    const button = document.getElementById('no-button');

    // Add event listener for mouseenter event
    button.addEventListener('mouseenter', function () {
      showMessage('No')
    });

    function showMessage(response) {
      if (response === "No") {
        const noButton = document.getElementById("no-button");
        const container = document.querySelector(".container");
        const maxWidth = window.innerWidth - noButton.offsetWidth;
        const maxHeight = window.innerHeight - noButton.offsetHeight;

        noButton.style.position = "absolute";

        document.getElementsByClassName("img")[0].src = "img/gun.gif";

        const randomX = Math.max(0, Math.floor(Math.random() * maxWidth));
        const randomY = Math.max(0, Math.floor(Math.random() * maxHeight));

        noButton.style.left = randomX + "px";
        noButton.style.top = randomY + "px";

        document.getElementById("question").textContent =
          "Альо, ти що там задумала?";
        document.getElementById("name").style.display = "none";

      }

      if (response === "Yes") {
        document.getElementById("name").remove();
        document.getElementById("no-button").remove();

        const yesMessage = document.getElementById("question");
        yesMessage.textContent = "З днем Св. Валентина! Бажаю щирого кохання, взаєморозуміння та щоб кожен день був сповнений теплом та ніжністю😉";
        yesMessage.style.display = "block";
        yesMessage.style.fontStyle = "normal";
        document.getElementsByClassName("img")[0].src = "img/hug.gif";

        document.getElementById("yesButton").remove();
      }
    }
  </script>
</body>

</html>
